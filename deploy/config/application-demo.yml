server:
  port: 13607

spring:
  datasource:
    dynamic:
      datasource:
        jm_cloud:
          url: jdbc:postgresql://aifaizhi-pg-src:5432/jm_cloud?currentSchema=dws_dsjsj
          username: dsjsj
          password: srcpass
        szsjzzkk:
          url: jdbc:postgresql://aifaizhi-pg-dst:5432/szsjzzkk?currentSchema=xcapp
          username: xcapp
